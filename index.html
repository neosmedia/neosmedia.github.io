<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyler Lange | Product & UX Designer</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --accent: #0071e3; /* Premium tech blue */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }

        .container {
            max-width: 600px;
        }

        .badge {
            display: inline-block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent);
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.15rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .cta-link {
            display: inline-block;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid var(--text-secondary);
            padding-bottom: 4px;
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        .cta-link:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        footer {
            margin-top: 4rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">Coming Soon</span>
        <h1>Tyler Lange</h1>
        <p>Product & UX Designer with 18 years of experience crafting digital products. Based in Vancouver, BC.</p>
        
        <!-- Replace the email address below with your actual contact email -->
        <a href="mailto:tylerlangebc@gmail.com" class="cta-link">Get in touch</a>
    </div>

    <footer>
        &copy; 2026 tylerlange.ca
    </footer>

</body>
</html>
